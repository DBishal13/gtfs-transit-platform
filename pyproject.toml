[project]
name = "gtfs-transit-platform"
version = "0.1.0"
description = "Generalized data engineering and geospatial analytics pipeline for GTFS transit feeds"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=16.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
postgis = [
    "psycopg[binary]>=3.1",
]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.1",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
]

[project.scripts]
gtfs-pipeline = "pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["pipeline*", "service*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern relies on calling Depends()/Query()/etc. in
# argument defaults — that's idiomatic here, not the mutable-default-argument bug B008
# otherwise flags.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "service.app.deps.require_role",
]
